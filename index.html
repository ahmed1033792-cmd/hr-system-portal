<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR System Portal</title>
    <style>
        :root { --primary-color: #2563eb; --bg-color: #f8fafc; --card-bg: #ffffff; --text-color: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .portal-container { width: 100%; max-width: 650px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; padding: 2.5rem; box-sizing: border-box; }
        h1 { color: var(--text-color); margin-bottom: 0.5rem; font-size: 1.8rem; text-align: center; }
        p.subtitle { color: #64748b; margin-bottom: 2rem; text-align: center; }
        .nav-buttons { display: flex; gap: 1rem; margin-bottom: 2rem; justify-content: center; }
        .nav-btn { background: #e2e8f0; color: var(--text-color); border: none; padding: 0.75rem 1.25rem; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none; transition: background 0.2s; }
        .nav-btn.active, .nav-btn:hover { background: var(--primary-color); color: white; }
        .section { display: none; }
        .section.active { display: block; }
        .form-group { margin-bottom: 1.25rem; text-align: left; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        input[type="text"], input[type="email"], input[type="date"], input[type="number"], select, textarea { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; box-sizing: border-box; outline: none; }
        textarea { resize: vertical; height: 100px; }
        .portal-btn { background: var(--primary-color); color: white; border: none; width: 100%; padding: 1rem; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background-color 0.2s; }
        .portal-btn:hover { background-color: #1d4ed8; }
        .status-message { margin-top: 1rem; text-align: center; font-weight: 600; }
    </style>
</head>
<body>
    <div class="portal-container">
        <h1>HR System Portal</h1>
        <p class="subtitle">Manage your leave requests and get policy assistance in one place.</p>
        
        <!-- Navigation Buttons -->
        <div class="nav-buttons">
            <button class="nav-btn active" onclick="switchTab('leave')">Submit Leave Request</button>
            <a href="https://ahmed1033792-cmd.github.io/hr-chatbot-ui/" class="nav-btn" target="_blank">Open HR Chatbot Assistant ↗</a>
        </div>

        <!-- Leave Request Form Section -->
        <div id="leaveSection" class="section active">
            <form id="leaveForm" onsubmit="submitLeaveRequest(event)">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required placeholder="e.g. Ahmed Ayman">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="employee@company.com">
                </div>

                <div class="form-group">
                    <label for="leaveType">Leave Type</label>
                    <select id="leaveType" required>
                        <option value="">Select leave type...</option>
                        <option value="Annual Leave">Annual Leave</option>
                        <option value="Casual Leave">Casual Leave</option>
                        <option value="Sick Leave">Sick Leave</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex:1;">
                        <label for="startDate">Start Date</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label for="endDate">End Date</label>
                        <input type="date" id="endDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="numDays">Number of Days</label>
                    <input type="number" id="numDays" min="1" required placeholder="e.g. 3">
                </div>

                <div class="form-group">
                    <label for="reason">Reason</label>
                    <textarea id="reason" required placeholder="Reason for leave request..."></textarea>
                </div>

                <div class="form-group">
                    <label for="medicalDoc">Medical Document / Attachment URL (Optional)</label>
                    <input type="text" id="medicalDoc" placeholder="Paste link if applicable">
                </div>

                <button type="submit" class="portal-btn" id="submitBtn">Submit Leave Request</button>
                <div id="statusMsg" class="status-message"></div>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.getElementById('leaveSection').classList.add('active');
        }

        async function submitLeaveRequest(event) {
            event.preventDefault();
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');
            
            btn.disabled = true;
            btn.textContent = 'Submitting...';
            statusMsg.textContent = '';

            const payload = {
                "Full Name ": document.getElementById('fullName').value.trim(),
                "Email Address ": document.getElementById('email').value.trim(),
                "Leave Type ": document.getElementById('leaveType').value,
                "Start Date ": document.getElementById('startDate').value,
                "End Date ": document.getElementById('endDate').value,
                "Number of Days  ": Number(document.getElementById('numDays').value),
                "Reason": document.getElementById('reason').value.trim(),
                "Medical Document  ": document.getElementById('medicalDoc').value.trim(),
                "timestamp": new Date().toISOString()
            };

            try {
                await fetch('https://adsgd.app.n8n.cloud/webhook/c8ea8564-fd32-49af-8e1b-6670a8907d6a', {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                statusMsg.style.color = '#16a34a';
                statusMsg.textContent = 'Leave request submitted successfully! Manager approval workflow triggered.';
                document.getElementById('leaveForm').reset();
            } catch (error) {
                statusMsg.style.color = '#dc2626';
                statusMsg.textContent = 'Failed to submit request. Please check your connection or n8n workflow.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Submit Leave Request';
            }
        }
    </script>
</body>
</html>
