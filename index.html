<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR System Portal</title>
    <style>
        :root { --primary-color: #2563eb; --bg-color: #f8fafc; --card-bg: #ffffff; --text-color: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .portal-container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; padding: 2.5rem; text-align: center; box-sizing: border-box; }
        h1 { color: var(--text-color); margin-bottom: 0.5rem; font-size: 1.8rem; }
        p { color: #64748b; margin-bottom: 2rem; }
        .button-group { display: flex; flex-direction: column; gap: 1rem; }
        .portal-btn { background: var(--primary-color); color: white; border: none; padding: 1rem 1.25rem; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; text-decoration: none; transition: background-color 0.2s; display: block; }
        .portal-btn:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="portal-container">
        <h1>HR System Portal</h1>
        <p>Select a service below to proceed:</p>
        
        <div class="button-group">
            <!-- Replace '#' with your Leave Request form link or Webhook URL if hosted separately -->
            <a href="#" class="portal-btn">Leave Request System</a>
            
            <!-- Links directly to your deployed HR Chatbot UI -->
            <a href="https://ahmed1033792-cmd.github.io/hr-chatbot-ui/" class="portal-btn">HR Chatbot Assistant</a>
        </div>
    </div>
</body>
</html>
