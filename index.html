<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR System Portal</title>
    <style>
        :root { --primary-color: #2563eb; --primary-hover: #1d4ed8; --bg-color: #f8fafc; --card-bg: #ffffff; --text-color: #1e293b; --text-muted: #64748b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { width: 100%; max-width: 480px; padding: 2rem; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem; }
        .portal-nav { display: flex; flex-direction: column; gap: 1rem; }
        .portal-btn { display: block; width: 100%; padding: 0.75rem 1rem; background-color: var(--primary-color); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; text-decoration: none; cursor: pointer; transition: background-color 0.2s ease; box-sizing: border-box; }
        .portal-btn:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>
    <div class="container">
        <h1>HR System Portal</h1>
        <p>Select a service below to proceed:</p>
        <div class="portal-nav">
            <!-- Replace '#' or your leave request workflow URL if you have one -->
            <a href="#" target="_blank" class="portal-btn">Leave Request System</a>
            <a href="https://ahmed1033792-cmd.github.io/hr-chatbot-ui/" target="_blank" class="portal-btn">HR Chatbot Assistant</a>
        </div>
    </div>
</body>
</html>
